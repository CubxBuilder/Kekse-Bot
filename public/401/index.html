<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 401 - Unauthorized</title>
    <style>
        :root {
				--bg-base: #0a0a0a;
				--bg-surface: #111111;
				--border: #2a2a2a;
				--text-primary: #ffffff;
				--text-secondary: #888888;
				--radius: 12px;
                --radius-sm: 6px;
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				color: var(--text-primary);
				font-family: 'Segoe UI', system-ui, sans-serif;
			}
			body {
				background-color: var(--bg-base);
				min-height: 100vh;
				display: flex;
				flex-direction: column;
			}
			header {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 24px;
				height: 56px;
				background: var(--bg-surface);
				border-bottom: 1px solid var(--border);
				flex-shrink: 0;
			}
			header h1 {
				font-size: 1.2rem;
				font-weight: 700;
				letter-spacing: 0.05em;
			}
			header h1:last-child {
				color: var(--text-secondary);
				font-weight: 400;
			}
			header .icon {
				width: 45px;
				height: 45px;
			}
			main {
				flex: 1;
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: 1fr 1fr;
				gap: var(--gap);
				padding: var(--gap);
				overflow: hidden;
			}
            article {
                grid-column: 1 / -1;
                flex-direction: column;
                display: flex;
                align-items: center;
            }
            article h1 {
                font-size: 75px;
            }
            article div {
                width: 200px;
                text-align: center;
                margin-bottom: 10px;
            }
            article button {
                padding: 5px 10px;
                background: #22222a;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                font-size: .78rem;
                cursor: pointer;
            }
    </style>
</head>
<body>
    <header>
		<img src="../icon.png" class="icon">
		<h1>Kekse Bot</h1>
		<h1>401 Unauthorized</h1>
	</header>
    <main>
        <article>
            <div>
                <h1>401</h1>
                <p>You are not authorized to enter this page.</p>
            </div>
            <button onclick="window.location.href = 'https://discord.com/channels/1423413347168157718/1567241113700532334'">Zurück</button>
        </article>
    </main>
</body>
</html>
